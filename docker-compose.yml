version: '3.8'

services:
  # FinGuard Application (Full-Stack Express + React Vite + High-Throughput Columnar Engine)
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
